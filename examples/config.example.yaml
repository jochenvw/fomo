# Workshop configuration (optional). Usually unnecessary: the facilitator runs
#   uv run fomo env pull --resource-group <rg>
# which writes .workshop/environment.json from the Bicep deployment outputs.
#
# Use this file for reuse-existing setups or to point at another environment:
#   uv run fomo status --config examples/config.example.yaml
#
# Precedence (low -> high): this file -> .workshop/environment.json -> FOMO_* -> CLI flags.
environment:
  subscription_id: 00000000-0000-0000-0000-000000000000
  resource_group: rg-fomo-dev
  location: swedencentral
  topology: shared            # shared = one Foundry/Search/Storage for the cohort; isolated = per participant

  foundry_account_name: fomo-abc123
  project_name: fomo
  # project_endpoint: https://fomo-abc123.services.ai.azure.com/api/projects/fomo

  chat_deployment: gpt-5-mini
  embedding_deployment: text-embedding-3-small
  embedding_dimensions: 1536
  decision_deployment: decision-1-1   # Microsoft-Decision-1.1, model version 1

  storage_account_name: fomostabc123
  search_service_name: fomo-srch-abc123
  search_connection_name: fomo-search
