[project]
name = "contoso-workshop"
version = "0.1.0"
description = "Contoso Oil Document Intelligence workshop: Simple RAG vs Metadata Miner (Microsoft-Decision-1) vs Smart RAG on Microsoft Foundry + Azure AI Search."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.1",
    "azure-search-documents>=11.6.0",
    "azure-ai-projects>=2.1.0",
    "azure-mgmt-authorization>=4.0.0",
    "requests>=2.32",
    "pypdf>=5.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
corpus = ["reportlab>=4.2"]

[project.scripts]
contoso = "contoso_workshop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
    "types-PyYAML",
    "reportlab>=4.2",
    "bandit>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contoso_workshop"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "corpus/generator"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["src/contoso_workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs live Azure credentials and CONTOSO_* environment (opt-in)",
    "e2e: full live end-to-end run (opt-in, incurs cost)",
]
addopts = "-m 'not integration and not e2e'"
